<!DOCTYPE html>
<html lang="fr">
    <head>

        <meta charset="utf-8" />
        <title>Mon premier formulaire</title>
        <style >
            ul {list-style: none;}
        </style>

    </head>



    <body>

        <h1 style="text-align: center; margin-top: 100px;">Formulaire d'inscription</h1>

        <form action="/ma-page-de-traitement" method="post">

            <ul>
                <li>
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required placeholder="Premier prénom uniquement">
                </li>
                <li>
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required placeholder="Nom de famille (comme indiqué sur votre passeport)" size="37">
                </li>
                <li>
                    <label for="age">Âge :</label>
                    <input type="number" id="age" name="age" min="1" max="120" required placeholder="Âge">
                </li>
                <li>
                    <label for="sexe">Sexe :</label>
                    <select id="sexe" name="sexe" required>
                        <option value="" disabled selected>Selectionner une options</option>
                        <option value="Homme">Homme</option>
                        <option value="Femme">Femme</option>
                        <option value="Autre">Autre</option>
                    </select>
                </li>
                <li>
                    <label for="email">Adresse mail :</label>
                    <input type="email" id="email" name="user_mail" required placeholder="Adresse mail">
                </li>
                <li>
                    <label for="adresse">Adresse postal</label>
                    <input type="text" id="adresse" name="adresse" required placeholder="Adresse postal">
                </li>
                <li>
                    <label for="postal">Code postal :</label>
                    <input type="number" id="postal" name="postal" required placeholder="Votre code postal">
                </li>
                <li>
                    <label for="ville">Ville :</label>
                    <input type="text" id="ville" name="ville" required placeholder="Votre ville">
                </li>

            </ul>

        </form>

    </body>

    <footer>



    </footer>



</html>
