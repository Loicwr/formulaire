<!DOCTYPE html>
<html lang="fr">
    <head>

        <meta charset="utf-8" />
        <title>Mon premier formulaire</title>
        <style >
            ul {list-style: none;}
        </style>

    </head>



    <body>

        <h1 style="text-align: center; margin-top: 100px;">Formulaire d'inscription</h1>

        <form action="/ma-page-de-traitement" method="post">

            <ul>
                <li>
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required placeholder="Premier prénom uniquement">
                </li>
                <li>
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required placeholder="Nom de famille (comme indiqué sur votre passeport)" size="37">
                </li>
                <li>
                    <label for="age">Âge :</label>
                    <input type="number" id="age" name="age" min="1" max="120" required placeholder="Âge">
                </li>
                <li>
                    <label for="sexe">Sexe :</label>
                    <input type="radio" id="homme" name="sexe" value="Homme" required>
                    <label for="homme">Homme</label>
                    <input type="radio" id="femme" name="sexe" value="Femme" required>
                    <label for="femme">Femme</label>
                    <input type="radio" id="autre" name="sexe" value="Autre" required>
                    <label for="autre">Autre</label>
                </li>
                <li>
                    <label for="email">Adresse mail :</label>
                    <input type="email" id="email" name="user_mail" required placeholder="Adresse mail">
                </li>
                <li>
                    <label for="adresse">Adresse postal</label>
                    <input type="text" id="adresse" name="adresse" required placeholder="Adresse postal">
                </li>
                <li>
                    <label for="postal">Code postal :</label>
                    <input type="number" id="postal" name="postal" required placeholder="Votre code postal">
                </li>
                <li>
                    <label for="ville">Ville :</label>
                    <input type="text" id="ville" name="ville" required placeholder="Votre ville">
                </li>
                <li>
                    <label for="métier">Métier exercé :</label>
                    <select id="métier" name="métier" required>
                        <option value="" disabled selected>Métier</option>
                        <option value="Maçon">Maçon</option>
                        <option value="Développeur Web">Développeur Web</option>
                        <option value="Boulanger">Boulanger</option>
                        <option value="Conducteur de bus">Conducteur de bus</option>
                        <option value="Banquier">Banquier</option>
                    </select>
                </li>
                <li>
                    <label for="nationalité">Nationalité :</label>
                    <select id="nationalité" name="nationalité" required>
                        <option value="Française" selected>Française</option>
                        <option value="Belge">Belge</option>
                        <option value="Espagnol">Espagnol</option>
                        <option value="Portugais">Portugais</option>
                        <option value="Suisse">Suisse</option>
                    </select>
                </li>
                <li>
                    <label for="date-de-naissance">Date de naissance :</label>
                    <input type="date" id="date-de-naissance" name="date-de-naissance" required>
                </li>
                <li>
                    <label for="pays-de-naissance">Pays de naissance :</label>
                    <input type="text" id="pays-de-naissance" name="pays-de-naissance" required placeholder="Votre pays de naissance">
                </li>
                <li>
                    <label for="numéro-sécu">Numéro de sécurité social :</label>
                    <input type="text" id="numéro-sécu" name="numéro-sécu" required placeholder="Votre numéro de sécurité social">
                </li>
                <li>
                    <label for="numéro-passeport">Vote numéro de passeport :</label>
                    <input type="text" id="numéro-passeport" name="numéro-passeport" required placeholder="Votre numéro de passeport">
                </li>

            </ul>

        </form>

    </body>

    <footer>



    </footer>



</html>
